<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="zenith-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="border-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Glassmorphic Rounded Square Container -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="#09090b" fill-opacity="0.8" stroke="url(#border-gradient)" stroke-width="1.5" />
  
  <!-- Subtle inner radial glow -->
  <circle cx="24" cy="24" r="16" fill="url(#zenith-gradient)" fill-opacity="0.06" filter="url(#neon-glow)" />

  <!-- Zenith Futuristic Sharp 'Z' Path -->
  <path d="M12 11H36L20 37H36" stroke="url(#zenith-gradient)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon-glow)" />
  
  <!-- Small glowing diamond at the apex of the Z -->
  <path d="M24 19L27 22L24 25L21 22Z" fill="#ffffff" fill-opacity="0.9" filter="url(#neon-glow)" />
</svg>